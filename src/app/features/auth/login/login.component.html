<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/images/image.png" alt="Melarium Logo">
      <h1>Iniciar Sesión</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form" novalidate>
      
      <div *ngIf="loginError" class="global-error">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          placeholder="tu@correo.com"
          [class.ng-invalid]="email?.invalid && email?.touched"
          [class.ng-valid]="email?.valid && email?.touched"
        />
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="error-message">
          <small *ngIf="email?.errors?.['required']">El correo electrónico es obligatorio.</small>
          <small *ngIf="email?.errors?.['email']">Por favor, introduce un correo válido.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="••••••••"
            [class.ng-invalid]="password?.invalid && password?.touched"
            [class.ng-valid]="password?.valid && password?.touched"
          />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <lucide-icon [name]="showPassword ? 'eye-off' : 'eye'"></lucide-icon>
          </button>
        </div>
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="error-message">
          <small *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="password?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</small>
        </div>
      </div>

      <button type="submit" class="auth-button" [disabled]="loginForm.invalid">Iniciar Sesión</button>

      <div class="switch-auth-link">
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
      </div>

    </form>
  </div>
</div>
