<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/images/image.png" alt="Melarium Logo">
      <h1>Crear Nuevo Usuario</h1>
    </div>
    
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>

      <div *ngIf="submissionError" class="global-error">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="global-success">
        {{ successMessage }}
      </div>

      <!-- Campo Nombre -->
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" class="form-control" formControlName="name" placeholder="Nombre del usuario">
        <div *ngIf="name?.invalid && (name?.dirty || name?.touched)" class="error-message">
          <small *ngIf="name?.errors?.['required']">El nombre es obligatorio.</small>
        </div>
      </div>

      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" formControlName="email" placeholder="usuario@correo.com">
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="error-message">
          <small *ngIf="email?.errors?.['required']">El correo es obligatorio.</small>
          <small *ngIf="email?.errors?.['email']">Introduce un correo válido.</small>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input [type]="passwordVisible ? 'text' : 'password'" id="password" class="form-control" formControlName="password" placeholder="••••••••">
          <lucide-icon [name]="passwordVisible ? 'eye-off' : 'eye'" (click)="togglePasswordVisibility()" class="password-toggle"></lucide-icon>
        </div>
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="error-message">
          <small *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="password?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</small>
        </div>
      </div>

      <!-- Campo Confirmar Contraseña -->
      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div class="password-wrapper">
          <input [type]="confirmPasswordVisible ? 'text' : 'password'" id="confirmPassword" class="form-control" formControlName="confirmPassword" placeholder="••••••••">
          <lucide-icon [name]="confirmPasswordVisible ? 'eye-off' : 'eye'" (click)="toggleConfirmPasswordVisibility()" class="password-toggle"></lucide-icon>
        </div>
        <div *ngIf="userForm.hasError('passwordMismatch') && confirmPassword?.touched" class="error-message">
          <small>Las contraseñas no coinciden.</small>
        </div>
      </div>

      <!-- Campo Rol -->
      <div class="form-group">
        <label for="rol">Rol del Usuario</label>
        <div class="select-wrapper">
          <select id="rol" class="form-control" formControlName="rol">
            <option value="" disabled>Seleccione un rol</option>
            <option value="visitante">Visitante</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div *ngIf="rol?.invalid && (rol?.dirty || rol?.touched)" class="error-message">
          <small *ngIf="rol?.errors?.['required']">Es obligatorio seleccionar un rol.</small>
        </div>
      </div>

      <button type="submit" [disabled]="userForm.invalid" class="auth-button">
        Crear Usuario
      </button>

    </form>
  </div>
</div>
