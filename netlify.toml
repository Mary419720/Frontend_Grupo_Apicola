# ========================================
# CONFIGURACIÓN DE NETLIFY
# Proyecto Angular + Functions
# ========================================

[build]
  command = "npm install --legacy-peer-deps && npm run build -- --configuration=production"
  publish = "dist/melarium/browser"
  base = "."  # Netlify considera la carpeta actual como base (Frontend_Grupo_Apicola/)

# Carpeta de funciones serverless
[functions]
  directory = "Functions"

# ========================================
# REDIRECTS Y REWRITES
# ========================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ========================================
# HEADERS DE SEGURIDAD
# ========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ========================================
# CONFIGURACIÓN DE NODE
# ========================================
[build.environment]
  NODE_VERSION = "18"
  NODE_OPTIONS = "--max-old-space-size=4096"
