<div class="form-card">
  <h2>Editar Producto</h2>

  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="loading-container">
    <p>Cargando datos del producto...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-container">
    <p class="error-message">{{ errorMessage }}</p>
  </div>

  <!-- Form Container -->
  <form *ngIf="!isLoading && !errorMessage" [formGroup]="productForm" (ngSubmit)="onSubmit()">
    
    <fieldset class="product-details-fieldset">
      <legend>Detalles del Producto</legend>
      <div class="form-grid">
        
        <div class="form-group">
          <label for="nombre">Nombre del Producto <span class="required">*</span></label>
          <input id="nombre" formControlName="nombre" type="text">
        </div>

        <div class="form-group">
          <label for="codigo">Código <span class="required">*</span></label>
          <input id="codigo" formControlName="codigo" type="text">
        </div>

        <div class="form-group form-group-full-width">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" formControlName="descripcion" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo <span class="required">*</span></label>
          <select id="tipo" formControlName="tipo">
            <option value="" disabled selected>Selecciona un tipo</option>
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="categoria_id">Categoría <span class="required">*</span></label>
          <select id="categoria_id" formControlName="categoria_id">
            <option value="" disabled selected>Selecciona una categoría</option>
            <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.nombre }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subcategoria_id">Subcategoría <span class="required">*</span></label>
          <select id="subcategoria_id" formControlName="subcategoria_id" [disabled]="!subcategories.length">
            <option value="" disabled selected>Selecciona una subcategoría</option>
            <option *ngFor="let sub of subcategories" [value]="sub._id">{{ sub.nombre }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estado">Estado <span class="required">*</span></label>
          <select id="estado" formControlName="estado">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
            <option value="Descontinuado">Descontinuado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estado_fisico">Estado Físico <span class="required">*</span></label>
          <select id="estado_fisico" formControlName="estado_fisico">
            <option value="Sólido">Sólido</option>
            <option value="Líquido">Líquido</option>
            <option value="Semisólido">Semisólido</option>
            <option value="Polvo">Polvo</option>
          </select>
        </div>



        <div class="form-group form-group-checkbox">
          <label for="activo">
            <input id="activo" formControlName="activo" type="checkbox">
            Producto Activo
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset class="images-fieldset">
      <legend>Imágenes del Producto</legend>
      <div class="form-group form-group-full-width">
        <label for="imagenes">Añadir nuevas imágenes (hasta 5)</label>
        <input id="imagenes" type="file" multiple accept="image/png, image/jpeg" (change)="onFileSelected($event)" class="file-input">
      </div>

      <div class="image-preview-gallery">
        <p *ngIf="imagePreviews.length === 0" class="no-images-message">No hay imágenes para este producto.</p>
        <div *ngFor="let preview of imagePreviews; let i = index" class="image-preview-item">
          <img [src]="preview.url" [alt]="'Vista previa ' + (i + 1)" class="preview-image">
          <button type="button" (click)="removeImage(i)" class="btn-remove-image" title="Eliminar imagen">×</button>
          <span class="image-source-label" [ngClass]="{'new-image': preview.source === 'Nueva', 'existing-image': preview.source === 'Existente'}">{{ preview.source }}</span>
        </div>
      </div>
    </fieldset>

    <fieldset formArrayName="presentaciones" class="presentations-fieldset">
      <legend>Presentaciones del Producto</legend>
      <div *ngFor="let presentationGroup of presentaciones.controls; let i=index" [formGroupName]="i" class="presentation-item">
        <h4>Presentación {{ i + 1 }} 
          <button type="button" (click)="onDeletePresentation(i)" class="btn-delete-presentation" title="Eliminar esta presentación">Eliminar</button>
        </h4>
        <div class="form-grid-presentation">
          <div class="form-group">
            <label for="sku-{{i}}">SKU <span class="required">*</span></label>
            <input id="sku-{{i}}" formControlName="sku" type="text">
          </div>
          <div class="form-group">
            <label for="formato-{{i}}">Formato <span class="required">*</span></label>
            <input id="formato-{{i}}" formControlName="formato" type="text">
          </div>
          <div class="form-group">
            <label for="capacidad-{{i}}">Capacidad <span class="required">*</span></label>
            <input id="capacidad-{{i}}" formControlName="capacidad" type="text">
          </div>
          <div class="form-group">
            <label for="precio_venta-{{i}}">Precio Venta <span class="required">*</span></label>
            <input id="precio_venta-{{i}}" formControlName="precio_venta" type="number" min="0">
          </div>
          <div class="form-group">
            <label for="precio_compra-{{i}}">Precio Compra <span class="required">*</span></label>
            <input id="precio_compra-{{i}}" formControlName="precio_compra" type="number" min="0">
          </div>
          <div class="form-group">
            <label for="stock-{{i}}">Stock <span class="required">*</span></label>
            <input id="stock-{{i}}" formControlName="stock" type="number" min="0">
          </div>
          <div class="form-group">
            <label for="stock_minimo-{{i}}">Stock Mínimo <span class="required">*</span></label>
            <input id="stock_minimo-{{i}}" formControlName="stock_minimo" type="number" min="0">
          </div>
          <div class="form-group">
            <label for="lote-{{i}}">Lote</label>
            <input id="lote-{{i}}" formControlName="lote" type="text">
          </div>
          <div class="form-group">
            <label for="fecha_ingreso-{{i}}">Fecha Ingreso</label>
            <input id="fecha_ingreso-{{i}}" formControlName="fecha_ingreso" type="date">
          </div>
          <div class="form-group">
            <label for="fecha_vencimiento-{{i}}">Fecha Vencimiento</label>
            <input id="fecha_vencimiento-{{i}}" formControlName="fecha_vencimiento" type="date">
          </div>
          <div class="form-group">
            <label for="proveedor-{{i}}">Proveedor</label>
            <input id="proveedor-{{i}}" formControlName="proveedor" type="text">
          </div>
          <div class="form-group">
            <label for="ubicacion-{{i}}">Ubicación</label>
            <input id="ubicacion-{{i}}" formControlName="ubicacion" type="text">
          </div>
          <div class="form-group form-group-full-width">
            <label for="observaciones-{{i}}">Observaciones</label>
            <textarea id="observaciones-{{i}}" formControlName="observaciones" rows="2"></textarea>
          </div>
          <div class="form-group form-group-checkbox">
            <label for="activo-{{i}}">
              <input id="activo-{{i}}" formControlName="activo" type="checkbox">
              Presentación Activa
            </label>
          </div>
        </div>
      </div>
      <button type="button" (click)="addPresentation()" class="btn btn-add-presentation">+ Añadir otra presentación</button>
    </fieldset>

    <div class="form-actions">
      <button type="button" routerLink="/admin/manage-products" class="btn btn-cancel">Cancelar</button>
      <button type="button" (click)="onDeleteProduct()" class="btn btn-danger" [disabled]="isSubmitting">Eliminar Producto</button>
      <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          {{ isSubmitting ? 'Actualizando...' : 'Actualizar Producto' }}
        </button>
    </div>
  </form>
</div>
